<!doctype html>
<html lang="zh-CN" data-palette="fresh" data-theme="light">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="description" content="DSH 插件生态图：把带 dsh 系列 GitHub 标签的仓库按功能铺成可交互的生态网络，含 21 个功能扇区、单扇区放大、双击聚焦与生态榜单，数据每小时更新。" />
<meta property="og:title" content="插件生态图 — DSH 插件生态扇区图" />
<meta property="og:description" content="把带 dsh 系列 GitHub 标签的仓库按功能铺成可交互的生态网络：21 个功能扇区、单扇区放大、双击聚焦、生态榜单。" />
<meta property="og:type" content="website" />
<title>插件生态图 — DSH 插件生态扇区图</title>
<link rel="icon" type="image/png" href="https://github.com/WTStarMark.png?size=64" />
<link rel="apple-touch-icon" href="https://github.com/WTStarMark.png?size=180" />
<link rel="stylesheet" href="./styles.css" />
</head>
<body>
<header class="cmdbar">
  <div class="brand">
    <span class="sigil" aria-hidden="true">◈</span>
    <div class="brand-text">
      <b>插件生态图</b>
      <small>插件生态扇区图 · v0.5.2</small>
    </div>
  </div>
  <div class="prompt">
    <span class="caret" aria-hidden="true">›</span>
    <input id="search" type="search" placeholder="搜索仓库 / 作者 / 描述，回车定位" autocomplete="off" spellcheck="false" />
    <button id="search-clear" class="key" hidden>清除</button>
    <button id="search-fan" class="key" hidden title="把搜索结果画成一张扇形图：圆心是官方仓库，节点只保留命中的仓库（快捷键：Shift 或 Ctrl + 回车）">成图</button>
  </div>
  <div class="readouts">
    <button class="ro ro-idx" id="index-source" aria-expanded="false" aria-controls="index-source-panel"
            title="DSH 插件市场索引地址：复制后加到 DSH 的「插件 → 发现 → 添加索引源」">
      <i>索引源</i><b>插件市场</b><span class="idx-caret" aria-hidden="true">▾</span>
    </button>
    <span class="ro"><i>数据源</i><b>GitHub 搜索接口</b></span>
    <span class="ro"><i>快照</i><b id="snapshot">--</b></span>
  </div>
  <div class="idx-panel" id="index-source-panel" hidden role="dialog" aria-label="DSH 插件市场索引源">
    <p class="idx-lead">把这条地址加进 DSH，就能在「插件 → 发现」里浏览并一键安装这些插件：</p>
    <div class="idx-row">
      <code id="index-source-url">https://www.moc-chen.cn/market/index.json</code>
      <button id="index-source-copy" class="key" title="复制索引地址">复制</button>
    </div>
    <ol class="idx-steps">
      <li>插件页 → <b>实验性插件</b> → 更多 → 启用「自定义插件市场」</li>
      <li>切到 <b>发现</b> → <b>添加索引源</b> → 粘贴上面的地址</li>
    </ol>
  </div>
  <div class="keys">
    <button id="toggle-rail" class="key" title="收起 / 展开左侧栏（快捷键 [）">左栏</button>
    <button id="trophy" class="trophy-btn" aria-haspopup="dialog" aria-expanded="false" aria-label="生态榜单：周更新热榜 / 周 star 热榜 / 周 npm 下载热榜" title="生态榜单：周更新热榜 / 周 star 热榜 / 周 npm 下载热榜">
      <i class="fa-solid fa-trophy" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path fill="currentColor" d="M7 2h10a1.5 1.5 0 0 1 1.5 1.5V9a6.5 6.5 0 0 1-5 6.32V18h-3v-2.68A6.5 6.5 0 0 1 5.5 9V3.5A1.5 1.5 0 0 1 7 2Z"/><path fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M5.5 5.5H3.6A1.6 1.6 0 0 0 2 7.1v.7a3.9 3.9 0 0 0 3.7 3.9M18.5 5.5h1.9A1.6 1.6 0 0 1 22 7.1v.7a3.9 3.9 0 0 1-3.7 3.9"/><rect x="4" y="18" width="16" height="2.6" rx="1.3" fill="currentColor"/></svg></i>
    </button>
    <button id="toggle-dossier" class="key" title="收起 / 展开右侧栏（快捷键 ]）">右栏</button>
    <a class="author" href="https://github.com/WTStarMark/dsh-plugin-mesh" target="_blank" rel="noreferrer" title="本项目仓库：WTStarMark/dsh-plugin-mesh">
      <img src="https://github.com/WTStarMark.png?size=64" alt="WTStarMark" loading="lazy" />
      <span>WTStarMark</span>
    </a>
    <button id="palette" class="key" title="切换配色：清爽 / 粉黛">清爽</button>
    <a id="feedback" class="key" href="https://github.com/WTStarMark/dsh-plugin-mesh/issues" target="_blank" rel="noreferrer" title="反馈与提问：GitHub Issues（新窗口打开）">反馈</a>
  </div>
</header>

<main class="deck">
  <aside class="rail" id="rail"></aside>

  <section class="stage" id="stage">
    <canvas id="graph"></canvas>

    <div class="hud hud-tl">
      <button data-act="zoom-in" title="放大">＋</button>
      <button data-act="zoom-out" title="缩小">－</button>
      <button data-act="fit" title="适应窗口">适应</button>
      <button data-act="relayout" title="重新布局">重排</button>
      <button data-act="labels" title="标签显隐">标签</button>
      <button data-act="avatars" class="on" title="作者头像显隐">头像</button>
      <button data-act="indexed" title="打开后：已被插件市场索引收录的仓库（有 npm 包）会套一层青绿光环，并在头像旁挂「索引仓库」小标；默认关">索引仓库</button>
    </div>
    <div class="hud hud-tr" id="edge-types"></div>

    <div class="tooltip" id="tooltip" hidden></div>
    <div class="loading" id="loading">正在载入抽样数据…</div>
  </section>

  <aside class="dossier" id="inspector"></aside>

  <footer class="ticker">
    <span class="lamp" id="lamp" aria-hidden="true"></span>
    <span class="tk-sys">运行正常</span>
    <span class="tk-body" id="hint">初始化…</span>
    <span class="tk-zoom" id="telemetry">缩放 1.00</span>
    <span class="tk-stats" id="stats" hidden>访问 -- · 在线 --</span>
  </footer>
</main>

<div id="ranking" class="modal" hidden role="dialog" aria-modal="true" aria-label="生态榜单">
  <div class="modal-mask" data-close="1"></div>
  <div class="modal-card">
    <header class="modal-head">
      <h3>生态榜单</h3>
      <div class="seg modal-seg" id="ranking-tabs">
        <button data-tab="updated" class="on">周更新热榜</button>
        <button data-tab="stars">周 star 热榜</button>
        <button data-tab="npm">周 npm 下载热榜</button>
      </div>
      <!-- 两个开关成对放：噪声没有时用 visibility 占位，避免「显示周下载」跳位；窄屏整组换行 -->
      <div class="modal-toggles" id="ranking-toggles">
        <label class="switch rank-toggle is-idle" id="ranking-noise" title="">
          <input type="checkbox" id="ranking-noise-box" role="switch" aria-checked="false">
          <span id="ranking-noise-label">隐藏噪声</span>
        </label>
        <label class="switch rank-toggle" id="ranking-npm" title="可选标注：覆盖不全；取不到按状态显示原因">
          <input type="checkbox" id="ranking-npm-box" role="switch" aria-checked="false">
          <span id="ranking-npm-label">显示周下载</span>
        </label>
      </div>
      <button id="ranking-close" class="key" aria-label="关闭榜单">✕</button>
    </header>
    <div class="modal-body" id="ranking-body"></div>
  </div>
</div>

<script type="module" src="./src/app.js"></script>
</body>
</html>
